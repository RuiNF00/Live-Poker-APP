# Publishes store/web (privacy, terms, support, delete-account) to GitHub Pages.
# One-time: Settings → Pages → Source: "GitHub Actions".
name: Legal pages

on:
  push:
    branches: [main]
    paths: ["store/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash store/scripts/fill.sh
      # GitHub Pages has no clean URLs, so /privacy needs privacy/index.html.
      - run: |
          cd store/out/web
          for f in privacy terms support delete-account; do
            mkdir -p "$f" && sed 's#href="\([a-z-]*\)\.html"#href="../\1.html"#g; s#href="style.css"#href="../style.css"#' "$f.html" > "$f/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: store/out/web
      - id: deployment
        uses: actions/deploy-pages@v4
